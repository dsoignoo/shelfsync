services:
  shelfsync:
    image: ghcr.io/dsoignoo/shelfsync:latest
    build: .
    container_name: shelfsync
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - shelfsync-data:/data
      - codex-home:/home/shelfsync/.codex
    environment:
      AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-http://audiobookshelf:13378}
      AUDIOBOOKSHELF_TOKEN: ${AUDIOBOOKSHELF_TOKEN:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_TIMEOUT_SECONDS: ${ELEVENLABS_TIMEOUT_SECONDS:-180}
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-180}
      SUMMARY_LANGUAGE: ${SUMMARY_LANGUAGE:-de}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
    # networks:
    #   - audiobookshelf_default

volumes:
  shelfsync-data:
  codex-home:
